# Production Application Properties
# Database Configuration (Railway will provide these via environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/knowyourcampus}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Prince@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Server Configuration
server.port=${PORT:8081}
server.servlet.context-path=/api

# JWT Configuration
jwt.secret=${JWT_SECRET:KnowYourCampus2026SecretKeyForJWTTokenGenerationAndValidation256Bit}
jwt.expiration=86400000

# CORS Configuration (Update with your Vercel domain)
cors.allowed.origins=${CORS_ORIGINS:http://localhost:5173,https://*.vercel.app}

# Application Configuration
spring.application.name=knowyourcampus-backend

# Logging
logging.level.com.knowyourcampus=INFO
logging.level.org.springframework.security=WARN

# Production optimizations
spring.jpa.open-in-view=false
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
