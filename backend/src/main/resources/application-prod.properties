# Production Configuration for AWS Deployment
spring.application.name=knowyourcampus

# Server Configuration
server.port=8080
server.servlet.context-path=/api
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Database Configuration (Supabase PostgreSQL - Environment variables from systemd service)
spring.datasource.url=jdbc:postgresql://${DB_HOST:aws-0-ap-northeast-2.pooler.supabase.com}:6543/${DB_NAME:postgres}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USERNAME:postgres.rlukiinxhenznsrbkurk}
spring.datasource.password=${DB_PASSWORD:Prince@123321@}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# dialect auto-detected by Hibernate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT Configuration
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production-make-it-very-long-and-random}
jwt.expiration=86400000

# CORS Configuration (CloudFront domain)
cors.allowed.origins=${CORS_ORIGINS:https://d111111abcdef8.cloudfront.net,http://localhost:5173}

# Logging Configuration
logging.level.root=INFO
logging.level.com.knowyourcampus=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=/var/log/knowyourcampus/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# Actuator Configuration (Health check for monitoring)
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=when-authorized
management.metrics.export.simple.enabled=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Performance Tuning
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# AWS CloudWatch Metrics Configuration
management.metrics.export.cloudwatch.namespace=KnowYourCampus
management.metrics.export.cloudwatch.step=1m
management.metrics.export.cloudwatch.enabled=true

# Actuator Endpoints Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
