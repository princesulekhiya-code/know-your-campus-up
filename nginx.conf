server {
    listen 80;
    server_name _;  # Accepts any domain or IP

    # =========================================================
    # FRONTEND: Serve React Static Files
    # =========================================================
    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;  # React Router Fix
    }

    # =========================================================
    # BACKEND: Proxy API Requests to Spring Boot (Port 8080)
    # =========================================================
    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: Serve Uploaded Images
    location /uploads {
        alias /opt/knowyourcampus/uploads;
    }
}
