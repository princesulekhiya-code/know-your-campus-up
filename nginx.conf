# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    server_name knowyourcampus.in www.knowyourcampus.in;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name knowyourcampus.in www.knowyourcampus.in;

    # SSL Certificate paths (will be updated by Certbot)
    ssl_certificate /etc/letsencrypt/live/knowyourcampus.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knowyourcampus.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # =========================================================
    # FRONTEND: Serve React Static Files
    # =========================================================
    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;  # React Router Fix
    }

    # =========================================================
    # BACKEND: Proxy API Requests to Spring Boot (Port 8080)
    # =========================================================
    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Serve Uploaded Images
    location /uploads {
        alias /opt/knowyourcampus/uploads;
    }
}
